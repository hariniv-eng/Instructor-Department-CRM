openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: instructors
    description: Instructor records and review
  - name: dashboard
    description: Dashboard summaries
  - name: uploads
    description: Source upload history
  - name: sync
    description: Live sync from Darwinbox and BigQuery/TeachOS
  - name: reports
    description: Instructor headcount and classification reporting
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /instructors:
    get:
      operationId: listInstructors
      tags: [instructors]
      summary: List instructors
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: sub_department
          schema: { type: string }
        - in: query
          name: designation
          schema: { type: string }
        - in: query
          name: source
          schema: { type: string }
        - in: query
          name: classification
          schema: { type: string }
        - in: query
          name: exit_flag
          schema: { type: string }
        - in: query
          name: dept_bucket
          description: >-
            Either a raw dept_bucket value (tech, non_tech, mentor,
            excluded_ops_managers, instructor_ops) or one of the three
            UI-facing group names (instructor, mentor, excluded).
          schema: { type: string }
        - in: query
          name: dept_area
          description: "Subject/sub-area within a tech or non_tech dept_bucket, e.g. Frontend, Backend, DSA, GenAI, Math, English, Aptitude."
          schema: { type: string }
        - in: query
          name: institute
          description: Filters to instructors whose institutes array contains this campus/university name.
          schema: { type: string }
      responses:
        "200":
          description: Instructor records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Instructor" }
    post:
      operationId: createInstructor
      tags: [instructors]
      summary: Create an instructor record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstructorInput" }
      responses:
        "201":
          description: Created instructor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instructor" }
  /instructors/{id}:
    get:
      operationId: getInstructor
      tags: [instructors]
      summary: Get an instructor
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Instructor record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instructor" }
        "404": { description: Not found }
    patch:
      operationId: updateInstructor
      tags: [instructors]
      summary: Update manual instructor status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstructorUpdate" }
      responses:
        "200":
          description: Updated instructor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instructor" }
        "404": { description: Not found }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get headcount and attrition dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /uploads:
    get:
      operationId: listUploads
      tags: [uploads]
      summary: List recent uploads
      responses:
        "200":
          description: Upload history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Upload" }
    post:
      operationId: uploadSource
      tags: [uploads]
      summary: Record a source upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "201":
          description: Upload recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
  /sync/darwinbox:
    post:
      operationId: syncDarwinbox
      tags: [sync]
      summary: Pull active employees from Darwinbox's Master API and reconcile
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResult" }
  /sync/darwinbox-exits:
    post:
      operationId: syncDarwinboxExits
      tags: [sync]
      summary: Pull the exit-employee report from Darwinbox's Reports Builder API and reconcile
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResult" }
  /sync/teachos:
    post:
      operationId: syncTeachos
      tags: [sync]
      summary: Pull instructor deployment data from BigQuery and reconcile
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResult" }
  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [sync]
      summary: Get auto-sync interval and most recent sync result per source
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
  /reports/instructors:
    get:
      operationId: getReportsInstructors
      tags: [reports]
      summary: Total instructor count and full breakdown (department, payroll, campus, manager, deployment)
      description: >
        The single reporting surface for the TeachOS instructor-count
        standing rule. Anchored on TeachOS's own instructor roster
        (in_teachos=true) reconciled against Darwin (primary
        Instructors-department match, then the full-roster fallback match —
        see darwin_match in the response) and the maintained classification
        overrides. kpis.total_instructor_count is the headline figure.
      responses:
        "200":
          description: Instructor report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstructorsReport" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Instructor:
      type: object
      required: [id, full_name, institutes, in_darwin, in_teachos, computed_status]
      properties:
        id: { type: number }
        employee_id: { type: ["string", "null"] }
        teachos_user_id: { type: ["string", "null"] }
        full_name: { type: string }
        org_email: { type: ["string", "null"] }
        mobile: { type: ["string", "null"] }
        date_of_joining: { type: ["string", "null"], format: date }
        department: { type: ["string", "null"] }
        sub_department: { type: ["string", "null"] }
        designation: { type: ["string", "null"] }
        direct_manager: { type: ["string", "null"] }
        work_location: { type: ["string", "null"] }
        workspace: { type: ["string", "null"] }
        gender: { type: ["string", "null"] }
        current_state: { type: ["string", "null"] }
        current_city: { type: ["string", "null"] }
        darwin_employee_status: { type: ["string", "null"] }
        in_darwin: { type: boolean }
        in_teachos: { type: boolean }
        teachos_role: { type: ["string", "null"] }
        teachos_category: { type: ["string", "null"] }
        teachos_manager: { type: ["string", "null"] }
        institutes:
          type: array
          items: { type: string }
        computed_status: { type: string }
        manual_status: { type: ["string", "null"] }
        exit_date: { type: ["string", "null"], format: date }
        converted_university_name: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        classification: { type: ["string", "null"], description: "TeachOS instructor-count classification override match — one of excluded_other_department, excluded_non_department_team, payroll_converted, or null. See classificationOverrides.ts / TEACHOS_INSTRUCTOR_COUNT_RULES.md." }
        classification_reason: { type: ["string", "null"] }
        exit_flag: { type: boolean, description: "True when a live Darwinbox exit/resignation record was found for this person. Flagged only — NOT subtracted from the standing instructor count." }
        exit_flag_status: { type: ["string", "null"], description: "Darwinbox resignation status as of the most recent exit sync, e.g. Approved, Pending With Approver, Rejected, Revoked." }
        exit_flag_date: { type: ["string", "null"], format: date }
        dept_bucket: { type: ["string", "null"], description: "tech | non_tech | null. See departmentTaxonomy.ts. Null for excluded/mentor rows (see classification)." }
        dept_area: { type: ["string", "null"], description: "Sub-area within dept_bucket, e.g. Frontend, Backend, DSA, GenAI, English, Aptitude, Math." }
        deployment_status: { type: ["string", "null"], description: "deployed | in_training | null, derived from TeachOS institutes (institute_name \"Training Institute\" = in_training)." }
        in_darwin_full_roster: { type: boolean, description: "True when this person's Darwin match came from the full/unfiltered company roster fallback rather than the primary Instructors-department sync — see reconcileDarwinFullRosterFallback()." }
    InstructorInput:
      type: object
      required: [full_name]
      properties:
        full_name: { type: string }
        employee_id: { type: ["string", "null"] }
        org_email: { type: ["string", "null"] }
        sub_department: { type: ["string", "null"] }
        designation: { type: ["string", "null"] }
    InstructorUpdate:
      type: object
      properties:
        manual_status: { type: ["string", "null"] }
        exit_date: { type: ["string", "null"], format: date }
        converted_university_name: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
    Dashboard:
      type: object
      required: [kpis, monthly_trend, sub_departments, designations]
      properties:
        kpis:
          type: object
          additionalProperties: { type: number }
        monthly_trend:
          type: array
          items:
            type: object
            required: [month, joiners, exits]
            properties:
              month: { type: string }
              joiners: { type: number }
              exits: { type: number }
        sub_departments:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: string }
              count: { type: number }
        designations:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: string }
              count: { type: number }
    Upload:
      type: object
      required: [id, source, filename, row_count, uploaded_at]
      properties:
        id: { type: number }
        source: { type: string }
        filename: { type: string }
        row_count: { type: number }
        uploaded_at: { type: string, format: date-time }
    UploadInput:
      type: object
      required: [source, filename, row_count]
      properties:
        source: { type: string }
        filename: { type: string }
        row_count: { type: number }
        rows:
          type: array
          description: Parsed tabular source rows, retained only long enough to reconcile the current snapshot.
          items:
            type: object
            additionalProperties: true
    SyncResult:
      type: object
      description: Result of one live sync attempt. Each sync replaces that source's own raw snapshot table only — sources are kept fully separate, nothing is matched/merged across them. `ok:false` means the attempt failed (network/credential/schema issue) — check `error`; `stored` is only meaningful when `ok:true`.
      required: [ok, source, synced_at]
      properties:
        ok: { type: boolean }
        source:
          type: string
          enum: [darwinbox_live, darwinbox_exits_live, teachos_live]
        stored: { type: ["number", "null"], description: "Row count now stored for this source after the replace." }
        error: { type: ["string", "null"] }
        synced_at: { type: string, format: date-time }
    SyncSourceStatus:
      type: object
      required: [auto_sync_interval_hours, last_sync]
      properties:
        auto_sync_interval_hours: { type: number }
        last_sync:
          oneOf:
            - $ref: "#/components/schemas/SyncResult"
            - type: "null"
    SyncStatus:
      type: object
      required: [darwinbox, darwinbox_exits, teachos]
      properties:
        darwinbox: { $ref: "#/components/schemas/SyncSourceStatus" }
        darwinbox_exits: { $ref: "#/components/schemas/SyncSourceStatus" }
        teachos: { $ref: "#/components/schemas/SyncSourceStatus" }
    InstructorsReport:
      type: object
      required: [kpis, darwin_match, department, payroll, campuses, managers, deployment, mentors, instructors]
      properties:
        kpis:
          type: object
          additionalProperties: { type: number }
          description: total_instructor_count is the headline "TeachOS instructor count" figure.
        darwin_match:
          type: object
          required: [matched_primary, matched_full_roster_fallback, not_in_darwin]
          properties:
            matched_primary: { type: number }
            matched_full_roster_fallback: { type: number }
            not_in_darwin: { type: number }
        department:
          type: object
          properties:
            tech: { $ref: "#/components/schemas/DeptBucketReport" }
            non_tech: { $ref: "#/components/schemas/DeptBucketReport" }
            unclassified: { type: number }
        payroll:
          type: object
          properties:
            payroll_converted: { type: number }
            non_payroll: { type: number }
        campuses:
          type: array
          items: { $ref: "#/components/schemas/GroupedInstructors" }
        managers:
          type: array
          items: { $ref: "#/components/schemas/GroupedInstructors" }
        deployment:
          type: object
          properties:
            deployed: { type: number }
            in_training: { type: number }
            unknown: { type: number }
        mentors:
          type: array
          items: { $ref: "#/components/schemas/ReportPerson" }
        instructors:
          type: array
          description: Every person counted in kpis.total_instructor_count, sorted by name. Backs a click-to-expand details view under the headline count.
          items: { $ref: "#/components/schemas/InstructorSummary" }
    DeptBucketReport:
      type: object
      properties:
        count: { type: number }
        areas:
          type: array
          items:
            type: object
            properties:
              area: { type: string }
              count: { type: number }
    GroupedInstructors:
      type: object
      properties:
        campus: { type: string, description: "Present on campus-grouped entries." }
        manager: { type: string, description: "Present on manager-grouped entries." }
        count: { type: number }
        instructors:
          type: array
          items: { $ref: "#/components/schemas/ReportPerson" }
    ReportPerson:
      type: object
      properties:
        id: { type: number }
        full_name: { type: string }
        employee_id: { type: ["string", "null"] }
        designation: { type: ["string", "null"] }
    InstructorSummary:
      type: object
      required:
        - id
        - full_name
        - employee_id
        - designation
        - department
        - dept_bucket
        - dept_area
        - is_payroll
        - deployment_status
        - institutes
        - manager
      properties:
        id: { type: number }
        full_name: { type: string }
        employee_id: { type: ["string", "null"] }
        designation: { type: ["string", "null"] }
        department: { type: ["string", "null"] }
        dept_bucket: { type: ["string", "null"] }
        dept_area: { type: ["string", "null"] }
        is_payroll: { type: boolean }
        deployment_status: { type: ["string", "null"] }
        institutes:
          type: array
          items: { type: string }
        manager: { type: ["string", "null"] }
